# Cross-version fixture: a pre-1.5 rodeo release (one that still writes the
# shared rodeo.rbxm), pinned the way a project pins it. The test proves that
# this tree coexists with such a build, so keep this a pre-1.5 version.
# tests-new/cli/operations/crossVersion.test.ts resolves the binary with
# `mise -C <this dir> which rodeo`.
[tools]
"ubi:revvy02/rodeo" = "1.4.0-rc.4"

# Pre-1.5 builds ignore RODEO_PORT; the test passes --port explicitly. Kept so
# the fixture reads like a real project.
[env]
RODEO_PORT = "46790"
