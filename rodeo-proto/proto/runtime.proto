syntax = "proto3";
package rodeo.runtime;

// ---------------------------------------------------------------------------
// Common "success with no payload" sentinel.
// Used in ClientRpcResponse oneof for methods that return bool-ok on success.
// ---------------------------------------------------------------------------

message Ok {}

// ---------------------------------------------------------------------------
// Stream operations
// ---------------------------------------------------------------------------

message StreamOpenRequest {
  string handle = 1;
  string path = 2;
  string mode = 3;  // "r" | "w" | "a"
}

message StreamOpenResponse {
  string handle = 1;
}

message StreamReadChunkRequest {
  string handle = 1;
  optional uint32 size = 2;  // max bytes to read; default 4096 if absent
}

message StreamReadChunkResponse {
  string data = 1;
  bool eof = 2;
}

message StreamReadLineRequest {
  string handle = 1;
}

message StreamReadLineResponse {
  string data = 1;
  bool eof = 2;
}

message StreamReadAllRequest {
  string handle = 1;
}

message StreamReadAllResponse {
  string data = 1;
}

message StreamWriteRequest {
  string handle = 1;
  string data = 2;
}

message StreamReadBytesRequest {
  string handle = 1;
  optional uint32 size = 2;  // max bytes to read; absent = read to EOF in one response
}

message StreamReadBytesResponse {
  bytes data = 1;
  bool eof = 2;
}

message StreamWriteBytesRequest {
  string handle = 1;
  bytes data = 2;
}

message StreamCloseRequest {
  string handle = 1;
}

// ---------------------------------------------------------------------------
// roblox: model/place serialization
// ---------------------------------------------------------------------------

// Finalize a model export. The plugin streams the serialized model into an
// open FileWriter via chunked stream_write_bytes (one RobloxExportRequest
// carrying the whole model would exceed the 4MiB connectrpc envelope cap and
// drop the backend), then sends this to consume the handle: the host converts
// to XML when the destination extension is .rbxmx/.rbxlx and writes the file
// atomically. Sent *instead of* stream_close.
message RobloxExportRequest {
  string handle = 1;
}

// Device-simulator session for roblox.capture. Handled by the PLUGIN (plugin
// identity can drive StudioDeviceSimulatorService; the run's own identity in
// client context cannot), never forwarded to the run client. One session per
// execution: apply selects a preset and/or a custom desktop device at the
// requested viewport and returns the resulting Camera.ViewportSize; restore
// puts back whatever was active before (the plugin also restores when the
// execution completes or is killed).
message RobloxSimulatorApplyRequest {
  optional string device = 1;   // StudioDeviceSimulatorService preset id
  optional uint32 width = 2;    // viewport override / custom device size
  optional uint32 height = 3;
}

message RobloxSimulatorApplyResponse {
  uint32 width = 1;             // Camera.ViewportSize after the change
  uint32 height = 2;
}

message RobloxSimulatorRestoreRequest {}

// Finalize a capture on the run client. The plugin read the exact frame the
// CaptureScreenshot callback named (EditableImage:ReadPixelsBuffer) and
// streamed the RGBA8 bytes into an open FileWriter on the output path via
// chunked stream_write_bytes; this consumes the handle in place of
// stream_close: checks the frame is a whole multiple of the viewport (a stale
// frame from before a viewport change is not), resamples to exactly width x
// height, encodes PNG and writes atomically.
message RobloxCaptureFinalizeRequest {
  string handle = 1;            // FileWriter holding source_width*source_height*4 RGBA bytes
  uint32 source_width = 2;      // frame size as read from the EditableImage
  uint32 source_height = 3;
  uint32 width = 4;             // Camera.ViewportSize at capture time = output size
  uint32 height = 5;
}

message RobloxCaptureFinalizeResponse {
  uint32 width = 1;             // written image size (== request)
  uint32 height = 2;
  uint32 source_width = 3;      // engine frame size before resampling
  uint32 source_height = 4;
}

// roblox.exportEditableImage: the plugin streamed an EditableImage's RGBA8
// pixels (ReadPixelsBuffer) into an open FileWriter on the output path; this
// consumes the handle in place of stream_close and writes the file as PNG
// (only .png is supported), atomically.
message RobloxImageEncodeRequest {
  string handle = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// roblox.importEditableImage: the host decodes the image file at `path`
// (PNG or JPEG) to RGBA8 and registers `handle` (minted by the caller like
// fs.open does) as a readable stream over those bytes, so the plugin pulls
// them with the ordinary chunked stream_read_bytes and closes the handle.
message RobloxImageDecodeRequest {
  string path = 1;
  string handle = 2;
}

message RobloxImageDecodeResponse {
  uint32 width = 1;
  uint32 height = 2;
}

// roblox.exportEditableMesh: the plugin streamed the mesh as rodeo's packed
// interchange blob (see rodeo-client/src/runtime/mesh.rs, BLOB LAYOUT) into an
// open FileWriter on the output path; this consumes the handle and writes the
// file as glTF (.glb binary, or .gltf with an embedded buffer).
message RobloxMeshEncodeRequest {
  string handle = 1;
}

// roblox.importEditableMesh: the host reads the glTF at `path`, bakes node
// transforms, merges primitives, and registers `handle` as a reader over the
// packed blob for the plugin to pull with chunked stream_read_bytes.
message RobloxMeshDecodeRequest {
  string path = 1;
  string handle = 2;
}

message RobloxMeshDecodeResponse {
  uint32 vertex_count = 1;
  uint32 face_count = 2;
  uint32 bone_count = 3;
}

// ---------------------------------------------------------------------------
// Filesystem operations
// ---------------------------------------------------------------------------

message FsExistsRequest {
  string path = 1;
}

message FsExistsResponse {
  bool exists = 1;
}

message FsStatRequest {
  string path = 1;
}

// Timestamps are milliseconds since UNIX epoch. Unit is in the field name
// to prevent silent cross-client drift (Rust was emitting ms, TS was emitting
// seconds under the old `created`/`modified`/`accessed` names).
message FsStatResponse {
  string type = 1;  // "file" | "dir"
  int64 size = 2;
  optional int64 created_millis = 3;
  optional int64 modified_millis = 4;
  optional int64 accessed_millis = 5;
}

message FsTypeRequest {
  string path = 1;
}

message FsTypeResponse {
  optional string type = 1;  // "file" | "dir" | absent if unknown
}

message FsMkdirRequest {
  string path = 1;
}

message FsListdirRequest {
  string path = 1;
}

message FsListdirResponse {
  repeated FsDirEntry entries = 1;
}

message FsDirEntry {
  string name = 1;
  string type = 2;  // "file" | "dir"
}

message FsRemoveRequest {
  string path = 1;
}

message FsRmdirRequest {
  string path = 1;
}

message FsCopyRequest {
  string src = 1;
  string dest = 2;
}

// ---------------------------------------------------------------------------
// Process operations
// ---------------------------------------------------------------------------

message ProcessOptions {
  optional string cwd = 1;
  optional string stdio = 2;  // "piped" | absent (inherited)
}

message ProcessGetInfoRequest {}

message ProcessGetInfoResponse {
  string cwd = 1;
  string homedir = 2;
  string execpath = 3;
  map<string, string> env = 4;
  optional string platform = 5;
  optional string arch = 6;
  optional string studio_content_path = 7;
}

message ProcessExitRequest {
  int32 code = 1;
}

message ProcessRunRequest {
  repeated string args = 1;
  optional ProcessOptions options = 2;
}

message ProcessRunResponse {
  bool ok = 1;
  int32 exitcode = 2;
  string out = 3;
  string err = 4;
}

message ProcessSystemRequest {
  string command = 1;
  optional ProcessOptions options = 2;
}

message ProcessCreateRequest {
  repeated string args = 1;
  optional ProcessOptions options = 2;
}

message ProcessCreateResponse {
  string pid = 1;
  optional string stdin_handle = 2;
  optional string stdout_handle = 3;
  optional string stderr_handle = 4;
}

message ProcessRunHandleRequest {
  string pid = 1;
}

message ProcessKillRequest {
  string pid = 1;
}

// ---------------------------------------------------------------------------
// MCP operations
// ---------------------------------------------------------------------------

message McpCallRequest {
  string tool = 1;
  string arguments_json = 2;
  string mcp_studio_id = 3;
}

message McpCallResponse {
  string result = 1;
}

// ---------------------------------------------------------------------------
// Typed client-side RPC envelopes.
//
// These are the wire format for RPCs flowing between the server and the
// run-client (the machine that submitted the run). The plugin ↔ server wire
// stays on JSON (plugin is single-impl in Luau); the server translates at
// egress so both run-client implementations (Rust + TS) dispatch on typed
// oneof cases instead of parallel string-based routing.
// ---------------------------------------------------------------------------

message ClientRpcCall {
  string id = 1;
  string execution_id = 2;
  oneof req {
    // fs: 10-19
    FsExistsRequest  fs_exists  = 10;
    FsStatRequest    fs_stat    = 11;
    FsTypeRequest    fs_type    = 12;
    FsMkdirRequest   fs_mkdir   = 13;
    FsListdirRequest fs_listdir = 14;
    FsRemoveRequest  fs_remove  = 15;
    FsRmdirRequest   fs_rmdir   = 16;
    FsCopyRequest    fs_copy    = 17;

    // stream: 20-29
    StreamOpenRequest       stream_open        = 20;
    StreamReadChunkRequest  stream_read_chunk  = 21;
    StreamReadLineRequest   stream_read_line   = 22;
    StreamReadAllRequest    stream_read_all    = 23;
    StreamWriteRequest      stream_write       = 24;
    StreamCloseRequest      stream_close       = 25;
    StreamReadBytesRequest  stream_read_bytes  = 26;
    StreamWriteBytesRequest stream_write_bytes = 27;

    // process: 30-39
    ProcessGetInfoRequest   process_get_info   = 30;
    ProcessExitRequest      process_exit       = 31;
    ProcessRunRequest       process_run        = 32;
    ProcessSystemRequest    process_system     = 33;
    ProcessCreateRequest    process_create     = 34;
    ProcessRunHandleRequest process_run_handle = 35;
    ProcessKillRequest      process_kill       = 36;

    // mcp: 40-49 (server-context; handled server-side, not forwarded to run-client)
    McpCallRequest          mcp_call           = 40;

    // roblox: 50-59
    RobloxExportRequest            roblox_export            = 50;
    // 51-52 are plugin-handled (see RobloxSimulatorApplyRequest).
    RobloxSimulatorApplyRequest    roblox_simulator_apply   = 51;
    RobloxSimulatorRestoreRequest  roblox_simulator_restore = 52;
    RobloxCaptureFinalizeRequest   roblox_capture_finalize  = 53;
    RobloxImageEncodeRequest       roblox_image_encode      = 54;
    RobloxImageDecodeRequest       roblox_image_decode      = 55;
    RobloxMeshEncodeRequest        roblox_mesh_encode       = 56;
    RobloxMeshDecodeRequest        roblox_mesh_decode       = 57;
  }
}

message ClientRpcResponse {
  string id = 1;
  string execution_id = 2;
  oneof res {
    // error path — set when the handler returned an error.
    string error = 3;

    // success payloads — tag matches the corresponding ClientRpcCall.req tag.
    // Methods with no meaningful success payload use `Ok`.

    // fs: 10-19
    FsExistsResponse  fs_exists  = 10;
    FsStatResponse    fs_stat    = 11;
    FsTypeResponse    fs_type    = 12;
    Ok                fs_mkdir   = 13;
    FsListdirResponse fs_listdir = 14;
    Ok                fs_remove  = 15;
    Ok                fs_rmdir   = 16;
    Ok                fs_copy    = 17;

    // stream: 20-29
    StreamOpenResponse      stream_open        = 20;
    StreamReadChunkResponse stream_read_chunk  = 21;
    StreamReadLineResponse  stream_read_line   = 22;
    StreamReadAllResponse   stream_read_all    = 23;
    Ok                      stream_write       = 24;
    Ok                      stream_close       = 25;
    StreamReadBytesResponse stream_read_bytes  = 26;
    Ok                      stream_write_bytes = 27;

    // process: 30-39
    ProcessGetInfoResponse  process_get_info   = 30;
    Ok                      process_exit       = 31;
    ProcessRunResponse      process_run        = 32;
    ProcessRunResponse      process_system     = 33;
    ProcessCreateResponse   process_create     = 34;
    ProcessRunResponse      process_run_handle = 35;
    Ok                      process_kill       = 36;

    // mcp: 40-49
    McpCallResponse         mcp_call           = 40;

    // roblox: 50-59
    Ok                             roblox_export            = 50;
    RobloxSimulatorApplyResponse   roblox_simulator_apply   = 51;
    Ok                             roblox_simulator_restore = 52;
    RobloxCaptureFinalizeResponse  roblox_capture_finalize  = 53;
    Ok                             roblox_image_encode      = 54;
    RobloxImageDecodeResponse      roblox_image_decode      = 55;
    Ok                             roblox_mesh_encode       = 56;
    RobloxMeshDecodeResponse       roblox_mesh_decode       = 57;
  }
}
